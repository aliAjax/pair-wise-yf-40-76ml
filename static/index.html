<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>植物病虫害检疫与传播追溯</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .35rem .7rem; cursor: pointer; margin: .1rem; }
    input, select { padding: .3rem; margin: .15rem; }
    section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #e5e7eb; padding: .4rem .5rem; text-align: left; font-size: .9rem; }
    .node { padding: .3rem .5rem; border-bottom: 1px solid #f3f4f6; font-size: .9rem; }
    .st-declared { color: #6b7280; } .st-inspected { color: #2563eb; }
    .st-quarantined, .st-restricted { color: #dc2626; font-weight: 600; }
    .st-pending_review { color: #d97706; font-weight: 600; }
    .st-released, .st-registered, .st-traced { color: #059669; }
    .st-destroyed { color: #374151; text-decoration: line-through; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; background: #f3f4f6; margin-right: .4rem; font-size: .8rem; }
    .progress { background: #e5e7eb; border-radius: 999px; height: .8rem; overflow: hidden; display: flex; }
    .progress div { height: 100%; }
    .p-confirmed { background: #dc2626; } .p-pending { background: #f59e0b; } .p-cleared { background: #10b981; } .p-rest { background: #d1d5db; }
  </style>
</head>
<body>
<main>
  <h1>植物病虫害检疫与传播追溯</h1>
  <p>演示身份固定为 <code>admin</code>。登记批次时填写来源批次与接收设施；确认虫害后系统自动标记所有下游批次与相关设施为待复核。</p>

  <section>
    <h2>登记</h2>
    <div>
      <b>设施：</b>
      <input id="facName" placeholder="名称" size="10">
      <input id="facAddr" placeholder="地址" size="14">
      <button onclick="createFacility()">创建设施</button>
    </div>
    <div style="margin-top:.5rem">
      <b>批次：</b>
      <input id="cCode" placeholder="批次号" size="8">
      <input id="cOrigin" placeholder="来源地" size="8">
      <input id="cDest" placeholder="目的地" size="8">
      <select id="cSource"><option value="">（无来源批次）</option></select>
      <select id="cFacility"><option value="">（无接收设施）</option></select>
      <button onclick="createConsignment()">创建批次</button>
    </div>
  </section>

  <section>
    <h2>批次与设施 <button onclick="refresh()">刷新</button></h2>
    <table id="batchTable"><thead><tr><th>批次号</th><th>状态</th><th>来源批次</th><th>接收设施</th><th>操作</th></tr></thead><tbody></tbody></table>
    <table id="facTable" style="margin-top:.6rem"><thead><tr><th>设施</th><th>状态</th><th>复核结果</th></tr></thead><tbody></tbody></table>
  </section>

  <section id="tracePanel" style="display:none">
    <h2>传播链与复核进度</h2>
    <div id="traceSummary"></div>
    <h3>批次传播关系</h3>
    <div id="traceBatches"></div>
    <h3>涉及设施</h3>
    <div id="traceFacilities"></div>
  </section>

  <section>
    <h2>结果</h2>
    <pre id="result">等待操作</pre>
  </section>
</main>
<script>
const HEADERS = {'Content-Type': 'application/json', 'X-User-Id': 'demo-admin', 'X-Role': 'admin'};
let cache = {batches: [], facilities: []};
let traceSource = null;

function show(obj) { document.getElementById('result').textContent = JSON.stringify(obj, null, 2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function short(id) { return id ? id.slice(0, 8) : ''; }
function codeOf(id) { const b = cache.batches.find(x => x.id === id); return b ? b.data.code : short(id); }
function facName(id) { const f = cache.facilities.find(x => x.id === id); return f ? f.data.name : (id ? short(id) : ''); }

async function api(method, path, body) {
  const resp = await fetch(path, {method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined});
  const json = await resp.json();
  if (!resp.ok) { show(json); throw new Error(json.error || resp.status); }
  return json;
}

async function refresh() {
  const [batches, facilities] = await Promise.all([
    api('GET', '/api/consignment'), api('GET', '/api/facility')
  ]);
  cache = {batches: batches.items, facilities: facilities.items};
  renderLists();
  if (traceSource) await loadTrace(traceSource);
}

function renderLists() {
  const srcSel = document.getElementById('cSource');
  const facSel = document.getElementById('cFacility');
  srcSel.innerHTML = '<option value="">（无来源批次）</option>' +
    cache.batches.map(b => `<option value="${b.id}">${esc(b.data.code)}</option>`).join('');
  facSel.innerHTML = '<option value="">（无接收设施）</option>' +
    cache.facilities.map(f => `<option value="${f.id}">${esc(f.data.name)}</option>`).join('');
  document.querySelector('#batchTable tbody').innerHTML = cache.batches.map(b => `
    <tr>
      <td>${esc(b.data.code)}</td>
      <td class="st-${b.status}">${b.status}</td>
      <td>${esc(codeOf(b.data.source_batch_id) || '')}</td>
      <td>${esc(facName(b.data.facility_id))}</td>
      <td>
        ${b.status === 'declared' ? `<button onclick="act('${b.id}','inspect',{inspector:'I-1',inspection_result:'checked'})">检疫</button>` : ''}
        ${b.status === 'inspected' ? `<button onclick="act('${b.id}','quarantine',{pest_found:true,sample_id:'S-'+Date.now()})">确认虫害</button>` : ''}
        ${b.status === 'pending_review' ? reviewButtons(b.id, false) : ''}
        <button onclick="loadTrace('${b.id}')">传播链</button>
      </td>
    </tr>`).join('');
  document.querySelector('#facTable tbody').innerHTML = cache.facilities.map(f => `
    <tr>
      <td>${esc(f.data.name)}</td>
      <td class="st-${f.status}">${f.status}</td>
      <td>${esc(f.data.review_result || '')} ${f.status === 'pending_review' ? reviewButtons(f.id, true) : ''}</td>
    </tr>`).join('');
}

function reviewButtons(id, isFacility) {
  const confirmData = isFacility ? '{}' : "{sample_id:'RS-'+Date.now()}";
  return `<button onclick="act('${id}','confirm_review',${confirmData})">确认隔离</button>` +
         `<button onclick="act('${id}','clear_review',{reason:'复核排除'})">排除</button>`;
}

async function act(id, action, data) {
  show(await api('POST', `/api/entities/${id}/actions`, {action, data}));
  await refresh();
}

async function createFacility() {
  const name = document.getElementById('facName').value, address = document.getElementById('facAddr').value;
  show(await api('POST', '/api/facility', {name, address}));
  await refresh();
}

async function createConsignment() {
  const data = {
    code: document.getElementById('cCode').value,
    origin: document.getElementById('cOrigin').value,
    destination: document.getElementById('cDest').value,
  };
  const src = document.getElementById('cSource').value, fac = document.getElementById('cFacility').value;
  if (src) data.source_batch_id = src;
  if (fac) data.facility_id = fac;
  show(await api('POST', '/api/consignment', data));
  await refresh();
}

function progressBar(p) {
  const done = p.confirmed + p.pending + p.cleared, rest = p.total - p.source - done;
  const pct = n => p.total ? (100 * n / p.total) : 0;
  return `<div class="progress">
    <div class="p-confirmed" style="width:${pct(p.confirmed)}%"></div>
    <div class="p-pending" style="width:${pct(p.pending)}%"></div>
    <div class="p-cleared" style="width:${pct(p.cleared)}%"></div>
    <div class="p-rest" style="width:${pct(p.source + rest)}%"></div>
  </div>
  <span class="badge">共 ${p.total}</span><span class="badge">源头 ${p.source}</span>
  <span class="badge">已确认 ${p.confirmed}</span><span class="badge">待复核 ${p.pending}</span>
  <span class="badge">已排除 ${p.cleared}</span><span class="badge">未涉及 ${rest}</span>`;
}

async function loadTrace(sourceId) {
  traceSource = sourceId;
  const view = await api('GET', '/api/trace/' + sourceId);
  show(view);
  document.getElementById('tracePanel').style.display = 'block';
  document.getElementById('traceSummary').innerHTML =
    `<p>源头批次：<b>${esc(view.source.data.code)}</b>（${view.source.status}）</p>` +
    `<p>批次进度：</p>` + progressBar(view.progress.batches) +
    `<p>设施进度：</p>` + progressBar(view.progress.facilities);
  document.getElementById('traceBatches').innerHTML = view.batches.map(b => `
    <div class="node" style="margin-left:${b.depth * 1.6}rem">
      ${'└ '.repeat(b.depth ? 1 : 0)}<b>${esc(b.code)}</b>
      <span class="st-${b.status}">${b.status}</span>
      ${b.is_source ? '<span class="badge">疫情源头</span>' : ''}
      ${b.review_result ? `<span class="badge">复核：${esc(b.review_result)}</span>` : ''}
      ${b.facility_id ? `<span class="badge">设施：${esc(facName(b.facility_id))}</span>` : ''}
      ${b.status === 'pending_review' ? reviewButtons(b.id, false) : ''}
    </div>`).join('');
  document.getElementById('traceFacilities').innerHTML = view.facilities.map(f => `
    <div class="node"><b>${esc(f.name)}</b> <span class="st-${f.status}">${f.status}</span>
      ${f.review_result ? `<span class="badge">复核：${esc(f.review_result)}</span>` : ''}
      ${f.status === 'pending_review' ? reviewButtons(f.id, true) : ''}
    </div>`).join('') || '<div class="node">（无涉及设施）</div>';
}

refresh().catch(show);
</script>
</body>
</html>
